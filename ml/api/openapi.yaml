openapi: 3.1.0
info:
  title: PODBORpro — внутренний интерфейс сервиса моделей
  version: 0.2.0
  description: |
    Сервис моделей на Node.js и @receptron/laya (многоязычная контрольная точка).
    Снаружи недоступен: обращаются сборщик и сервер на Go.
    /resume/parse и /letter описаны, но ещё не реализованы.

servers:
  - url: http://ml:8000

paths:
  /health:
    get:
      operationId: health
      summary: Проверка, что сервис жив и модель загружена
      description: Пока веса скачиваются и загружаются, отвечает 503 со status = loading.
      responses:
        "200":
          description: Готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, model: duration465/laya-onnx@94d8afa/multilingual, revision: 94d8afa4944520285b8ccebc174be4d24896d796 }
        "503":
          description: Модель ещё загружается или не загрузилась
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: loading, model: null, revision: 94d8afa4944520285b8ccebc174be4d24896d796 }

  /classify:
    post:
      operationId: classify
      summary: Разметка вакансий моделью Laya multilingual
      description: |
        Каскад «правила → Laya». Формат работы берётся из поля сайта, английский
        определяется правилами, а модель спрашивается только там, где правило не решило.
        Грейд берётся из названия, если в нём ровно один уровень; иначе модель выбирает
        из двух уровней, подходящих под опыт с сайта.
        Направление сначала ищут правила по названию и навыкам; модель спускается по дереву тегов
        (один вопрос choice на уровень) только там, где правило не дошло до листа.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassifyRequest" }
            example:
              items:
                - id: "headhunter:137568898"
                  title: Junior+ golang разработчик
                  text: "Опыт: 1–3 года. Требования: Go, PostgreSQL, английский B1"
                  experience: 1–3 года
                  work_format_raw: удалённо
                  skills: [Go, PostgreSQL]
      responses:
        "200":
          description: Ответы в том же порядке, что и вакансии
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassifyResponse" }
              example:
                model: duration465/laya-onnx@94d8afa/multilingual
                items:
                  - id: "headhunter:137568898"
                    answers:
                      tags: [{ path: it/backend/go, label: Backend / Go, confidence: 0.95, stopped: leaf, source: rule }]
                      grade: { value: junior, confidence: 0.95, source: rule }
                      work_format: { value: remote, confidence: 0.95, source: source }
                      english: { value: true, confidence: 0.95, source: rule }
                    needs_review: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /resume/parse:
    post:
      operationId: parseResume
      summary: Текст, навыки и проекты из файла резюме
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: PDF или DOCX }
      responses:
        "200":
          description: Разобранное резюме
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParsedResume" }
              example:
                text: Иван Петров. Разработчик на Go...
                skills: [Go, PostgreSQL]
                projects: [{ title: Агрегатор вакансий, summary: "Сервер на Go, PostgreSQL" }]
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /letter:
    post:
      operationId: composeLetter
      summary: Черновик сопроводительного письма
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LetterRequest" }
            example:
              vacancy: { title: Разработчик на Go, company: Ромашка, description: Ищем разработчика..., skills: [Go, Kubernetes] }
              projects: [{ title: Агрегатор вакансий, summary: "Сервер на Go, PostgreSQL" }]
              tone: neutral
      responses:
        "200":
          description: Письмо и фрагменты, которых нет в проектах
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LetterResponse" }
              example:
                text: Здравствуйте! Меня заинтересовала вакансия разработчика на Go. Я работал с Kubernetes...
                unverified: [{ start: 120, end: 130, text: Kubernetes }]
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_error, message: Пустой список texts } }
    Unavailable:
      description: Модель не загружена или языковая модель недоступна
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: model_unavailable, message: Модель недоступна } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Health:
      type: object
      required: [status, model, revision]
      properties:
        status: { type: string, enum: [ok, loading, error] }
        model: { type: [string, "null"] }
        revision: { type: string }

    ClassifyRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [id, title, text]
            properties:
              id: { type: string }
              title: { type: string }
              text: { type: string }
              experience: { type: string }
              work_format_raw: { type: string }
              skills: { type: array, items: { type: string } }

    Label:
      type: object
      required: [value, confidence, source]
      properties:
        value: {}
        confidence: { type: number }
        source: { type: string, enum: [rule, laya, source] }

    Tag:
      type: object
      required: [path, label, confidence, stopped, source]
      properties:
        path: { type: string }
        label: { type: string }
        confidence: { type: number }
        stopped: { type: string, enum: [leaf, low_confidence, other] }
        source: { type: string, enum: [rule, laya] }

    ClassifyResponse:
      type: object
      required: [model, items]
      properties:
        model: { type: string }
        items:
          type: array
          items:
            type: object
            required: [id, answers, needs_review]
            properties:
              id: { type: string }
              needs_review: { type: boolean }
              answers:
                type: object
                required: [tags, grade, work_format, english]
                properties:
                  tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
                  grade: { $ref: "#/components/schemas/Label" }
                  work_format: { $ref: "#/components/schemas/Label" }
                  english: { $ref: "#/components/schemas/Label" }

    Project:
      type: object
      required: [title, summary]
      properties:
        title: { type: string }
        summary: { type: string }

    ParsedResume:
      type: object
      required: [text, skills, projects]
      properties:
        text: { type: string }
        skills:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    LetterRequest:
      type: object
      required: [vacancy, projects, tone]
      properties:
        vacancy:
          type: object
          required: [title, company, description, skills]
          properties:
            title: { type: string }
            company: { type: string }
            description: { type: string }
            skills:
              type: array
              items: { type: string }
        projects:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/Project" }
        tone: { type: string, enum: [formal, neutral, friendly] }

    LetterResponse:
      type: object
      required: [text, unverified]
      properties:
        text: { type: string }
        unverified:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: integer }
              end: { type: integer }
              text: { type: string }
