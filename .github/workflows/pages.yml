name: pages

# Демо клиентской части на GitHub Pages: чистые HTML/CSS/JS, без сборки.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Подпроект Pages живёт по адресу /<repo>/, поэтому подставляем base href.
      - name: Set base path for GitHub Pages
        run: sed -i 's|<base href="/"[^>]*>|<base href="/${{ github.event.repository.name }}/">|' web/index.html

      # Pages не знает про маршруты клиента: /feed отдаём той же страницей.
      - name: SPA fallback
        run: cp web/index.html web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
