name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Типы и заглушки создаются из описания REST-интерфейса.
      # Генерация выполняется перед сборкой: если openapi.yaml поменяли, а типы не
      # пересоздали — следующая проверка станет красной, а не ошибкой на показе.
      - name: Generate types and stubs
        run: pnpm run generate

      - name: Generated files are up to date
        run: git diff --exit-code -- src/api/schema.d.ts src/api/stubs

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
