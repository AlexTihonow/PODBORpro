name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: find web/js web/dev-server.mjs -name "*.js" -o -name "*.mjs" | xargs -n1 node --check

      - name: Check stylesheets and data
        run: |
          grep -o 'href="css/[^"]*"' web/index.html | cut -d'"' -f2 | sed 's|^|web/|' | xargs ls
          node -e 'const d=require("./web/data/vacancies.json"); if(!d.items.length) process.exit(1); console.log(d.items.length, "vacancies")'
