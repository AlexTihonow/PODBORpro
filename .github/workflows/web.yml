name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Клиент — обычные ES-модули: проверяем синтаксис без установки зависимостей.
      - name: Check JavaScript syntax
        run: |
          for file in web/js/*.js web/js/pages/*.js web/dev-server.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check required static files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/favicon.svg
