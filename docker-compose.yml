services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: podbor
      POSTGRES_PASSWORD: podbor
      POSTGRES_DB: podbor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podbor -d podbor"]
      interval: 3s
      timeout: 3s
      retries: 20

  ml:
    build: ./ml
    expose:
      - "8000"
    volumes:
      - laya:/models

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      DATABASE_URL: postgres://podbor:podbor@db:5432/podbor?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ML_URL: http://ml:8000
      # Ключ Z.AI берётся из файла .env рядом с этим файлом (он в .gitignore).
      # Сюда значение не вписывать.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7-flash}
      ZAI_TIMEOUT_SECONDS: ${ZAI_TIMEOUT_SECONDS:-60}
      COVER_LETTER_LIMIT_PER_HOUR: ${COVER_LETTER_LIMIT_PER_HOUR:-10}
    ports:
      - "8080:8080"
    volumes:
      - ./web:/app/web:ro

volumes:
  pgdata:
  laya:
