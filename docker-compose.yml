services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: podbor
      POSTGRES_PASSWORD: podbor
      POSTGRES_DB: podbor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podbor -d podbor"]
      interval: 3s
      timeout: 3s
      retries: 20

  ml:
    build: ./ml
    expose:
      - "8000"
    volumes:
      - laya:/models

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      DATABASE_URL: postgres://podbor:podbor@db:5432/podbor?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev}
      ML_URL: http://ml:8000
    ports:
      - "8080:8080"
    volumes:
      - ./web:/app/web:ro

volumes:
  pgdata:
  laya:
